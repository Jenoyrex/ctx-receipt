name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: ci (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [20, 22]
        include:
          - os: macos-latest
            node: 22
          - os: windows-latest
            node: 22
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Pack, install the tarball in an empty folder, and run it
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/app"
          cd "$RUNNER_TEMP/app"
          npm init -y > /dev/null
          npm install "$RUNNER_TEMP"/ctx-receipt-*.tgz
          npx --no-install ctx-receipt --version
          npx --no-install ctx-receipt "$GITHUB_WORKSPACE/examples/demo/project" --home "$GITHUB_WORKSPACE/examples/demo/home" --budget 1000
