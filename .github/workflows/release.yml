name: Release

on:
  push:
    tags: ["v*"]

# Publishes with npm trusted publishing (OIDC): no npm token is stored anywhere. One-time setup on
# npmjs.com: package ctx-receipt > Settings > Trusted Publisher > GitHub Actions, organization
# or user "Jenoyrex", repository "ctx-receipt", workflow "release.yml". Until that is set up, the
# publish step fails, and publishing by hand (`npm publish`) still works.
permissions:
  contents: read
  id-token: write # trusted publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Use an npm that supports trusted publishing (11.5.1 or later)
        run: npm install --global npm@^11.5.1
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Check the tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - name: Skip publishing if this version is already on npm
        id: published
        run: |
          version=$(node -p 'require("./package.json").version')
          if npm view "ctx-receipt@$version" version > /dev/null 2>&1; then
            echo "ctx-receipt@$version is already on npm; nothing to publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.published.outputs.skip != 'true'
        run: npm publish --provenance --access public
